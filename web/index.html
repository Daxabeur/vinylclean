<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>vinylclean</title>
<!--
  vinylclean control page (English / French). It is read from disk on every
  load (/usr/local/share/vinylclean/index.html): it can be edited and the page
  simply reloaded. No external library.
-->
<style>
  :root {
    --bg: #14161a; --card: #1d2026; --line: #2c3038; --txt: #e8e6e1; --dim: #9a9ea6;
    --acc: #e0a85a; --ok: #6cbf84; --warn: #e0a85a; --bad: #e06a5a;
    --r: 14px; --fs: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: var(--fs)/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px; max-width: 760px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; gap: 10px; margin: 2px 2px 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  header .info { margin-left: auto; color: var(--dim); font-size: 13px; text-align: right; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: #252931;
    color: var(--txt); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 4px; }
  .seg button small { display: block; font-weight: 400; color: var(--dim); font-size: 12px; }
  .seg button.sel { background: var(--acc); border-color: var(--acc); color: #1a1408; }
  .seg button.sel small { color: #3b2c12; }
  .seg.sens button { min-height: 46px; font-size: 18px; padding: 0; }
  .row { margin: 14px 0 4px; }
  .row label { display: flex; justify-content: space-between; font-weight: 600; }
  .row label span { color: var(--acc); font-variant-numeric: tabular-nums; }
  .row label span.lbl { color: inherit; }
  .row p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  input[type=range] { width: 100%; height: 44px; margin: 4px 0 0; background: transparent; -webkit-appearance: none; appearance: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px;
    border-radius: 50%; background: var(--acc); border: 0; }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--acc); border: 0; }
  .meters { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
  .bar { height: 12px; border-radius: 6px; overflow: hidden; position: relative;
    /* zones: green up to −12 dB, orange to −1 dB, red above (scale −60 … 0 dB) */
    background: linear-gradient(90deg, #26352b 0 80%, #3a3222 80% 98.3%, #45231f 98.3% 100%); }
  .bar::before, .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: #5a5f69; z-index: 2; }
  .bar::before { left: 80%; } .bar::after { left: 90%; }   /* −12 and −6 dB */
  .bar .hold { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -3px; background: var(--ok); z-index: 3; display: none; }
  .bar .hold.hot { background: var(--warn); } .bar .hold.clip { background: var(--bad); }
  .db.clip { color: var(--bad); font-weight: 700; }
  .ticks { position: relative; height: 13px; font-size: 11px; color: var(--dim); }
  .ticks span { position: absolute; top: -2px; transform: translateX(-50%); }
  .clipwarn { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #4a1f1a; color: #ffd1c9; border: 1px solid var(--bad);
    font-weight: 600; font-size: 14px; cursor: pointer; }
  .advice { margin: 10px 0 0; font-weight: 600; font-size: 14px; }
  .advice.ok { color: var(--ok); } .advice.warn { color: var(--warn); } .advice.bad { color: var(--bad); } .advice.dim { color: var(--dim); }
  #lvBox summary .lvsum { font-weight: 500; font-size: 14px; margin-left: 8px; }
  .stats b.warn { color: var(--warn); }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s linear; }
  .bar i.hot { background: var(--warn); } .bar i.clip { background: var(--bad); }
  .db { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 52px; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--dim); font-size: 12px; }
  .alert { border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; font-weight: 600; display: none; }
  .alert.show { display: block; }
  .alert.sat { background: #4a1f1a; color: #ffd1c9; border: 1px solid var(--bad); }
  .alert.err { background: #3a2f16; color: #ffe3b0; border: 1px solid var(--warn); }
  select, .btn { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: #252931;
    color: var(--txt); font: inherit; padding: 0 10px; margin-top: 6px; }
  .btn { background: var(--acc); color: #1a1408; font-weight: 700; border: 0; cursor: pointer; margin-top: 12px; }
  details summary { cursor: pointer; font-weight: 600; list-style: none; }
  details summary::after { content: " ▾"; color: var(--dim); }
  .note { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
  .note.warn { color: var(--warn); }
  /* Landscape touchscreen (e.g. 800 × 480): two columns, no scrolling. */
  @media (min-width: 700px) and (orientation: landscape) {
    body { max-width: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; padding: 8px 10px; }
    header, .alert { grid-column: 1 / -1; }
    header { margin: 0 2px 6px; }
    .card { margin-bottom: 8px; padding: 9px 12px; }
    .card h2 { margin-bottom: 6px; }
    .seg button { min-height: 44px; }
    .row { margin: 6px 0 0; }
    input[type=range] { height: 34px; margin: 0; }
    .meters { gap: 3px 8px; }
    .stats b { font-size: 18px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    .seg button small { display: none; }
    .seg button { min-height: 42px; }
  }
  body.kiosk { --fs: 17px; }
  [hidden] { display: none !important; }
  .sub { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); font-weight: 600;
    margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--ok); }
  /* Recording */
  .recrow { display: flex; gap: 8px; align-items: center; }
  input[type=text] { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: #252931;
    color: var(--txt); font: inherit; padding: 0 12px; user-select: text; -webkit-user-select: text; }
  input[type=text]:disabled { opacity: .55; }
  .btn { min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: #252931; color: var(--txt);
    font: inherit; font-weight: 600; padding: 0 14px; cursor: pointer; text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.rec { flex: 1; }
  .btn.rec .rd { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); }
  .btn.stop { flex: 1; }
  .btn.stop .sq { width: 13px; height: 13px; background: var(--txt); border-radius: 2px; }
  .btn.small { min-height: 42px; font-weight: 500; font-size: 15px; }
  .btn.danger { color: var(--bad); }
  .btn.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
  .recstate { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .recstate .live { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .reclist { list-style: none; margin: 0; padding: 0; }
  .reclist li { padding: 10px 0; border-top: 1px solid var(--line); }
  .reclist li:first-child { border-top: 0; padding-top: 2px; }
  .reclist .nm { font-weight: 600; word-break: break-word; }
  .reclist .meta { color: var(--dim); font-size: 13px; margin: 2px 0 8px; }
  .reclist .acts { display: flex; gap: 8px; }
  .reclist .acts .btn { flex: 1; }
  /* Anti-distortion */
  input[type=number] { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: #252931;
    color: var(--txt); font: inherit; padding: 0 12px; margin-top: 6px; user-select: text; -webkit-user-select: text; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .geo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 12px; }
  .geo b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--acc); }
  .geo span { color: var(--dim); font-size: 12px; }
  .adst { font-variant-numeric: tabular-nums; margin-top: 10px; font-size: 14px; }
  svg.terr { width: 100%; height: auto; margin-top: 10px; display: block; }
  svg.terr text { fill: var(--dim); font-size: 11px; font-family: inherit; }
  /* Language switch */
  .lang { display: flex; gap: 4px; margin-left: auto; }
  .lang button { background: #252931; color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 9px; cursor: pointer; }
  .lang button.sel { background: var(--acc); color: #1a1408; border-color: var(--acc); }
  header .lang + .info { margin-left: 10px; }
  .vulink { margin-left: auto; color: var(--acc); font-size: 13px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; white-space: nowrap; }
  .vulink + .lang { margin-left: 8px; }
  header { flex-wrap: wrap; row-gap: 4px; }
  header .info { white-space: nowrap; }
  @media (max-width: 520px) { header .lang + .info { margin-left: auto; } }
  /* ---- Page mode (touchscreen of the box, index.html?mode=pages): one group of
     settings per screen, never any scrolling; arrows, swipe and dots. ---- */
  body.pages { max-width: none; height: 100vh; height: 100dvh; padding: 0; margin: 0; overflow: hidden; display: block; }
  body.pages > :not(#pgUi) { display: none !important; }   /* normal layout (and the desktop card) hidden */
  #pgUi { display: none; }
  body.pages #pgUi { display: flex; flex-direction: column; position: fixed; inset: 0; background: var(--bg); }
  .pg-top, .pg-bot { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
  .pg-top { border-bottom: 1px solid var(--line); }
  .pg-bot { border-top: 1px solid var(--line); }
  .pg-title { flex: 1; text-align: center; font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-title small { color: var(--dim); font-weight: 500; margin-left: 6px; }
  .pg-btn { min-width: 64px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #252931;
    color: var(--txt); font: inherit; font-weight: 700; cursor: pointer; padding: 0 12px; touch-action: manipulation; }
  .pg-btn.arrow { min-width: 88px; font-size: 22px; }
  .pg-btn:disabled { opacity: .3; }
  .pg-btn.simple { color: var(--acc); font-size: 15px; }
  .pg-dots { flex: 1; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 44px; }
  .pg-dots button { width: 22px; height: 44px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pg-dots button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #3a3f48; }
  .pg-dots button.sel::before { background: var(--acc); width: 13px; height: 13px; }
  .pg-dots button.gs { margin-left: 8px; }
  .pg-alerts { flex: none; padding: 0 8px; }
  .pg-alerts .alert { margin: 6px 0 0; padding: 7px 12px; }
  .pg-view { flex: 1; min-height: 0; position: relative; overflow: hidden; padding: 8px; touch-action: none; }
  .pg { position: absolute; inset: 8px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 10px 14px; column-gap: 26px; column-fill: auto; display: none; }
  .pg.cur { display: block; animation: pgIn .18s ease-out; }
  .pg.meas { display: block; visibility: hidden; }
  @keyframes pgIn { from { opacity: .4; transform: translateX(var(--from, 0)); } to { opacity: 1; transform: none; } }
  .pg > * { break-inside: avoid; }
  .pg > :first-child, .pg > .row:first-child { margin-top: 0; }
  .pg h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 10px 0 6px; font-weight: 600; }
  .pg > h2:first-child, .pg > .pgw:first-child > h2:first-child { display: none; }
  .pg > .pgw > h2 { margin-top: 10px; }
  .pg > .pgw:first-child > .sub { margin-top: 0; padding-top: 0; border-top: 0; }
  .pg > .sub:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .pg .stats { margin-top: 10px; }
  .pg .reclist li:first-child { border-top: 0; padding-top: 2px; }
  .pg > .reclist { margin: 0; }
  .pg > .reclist li { break-inside: avoid; }
  body.pages input[type=text] { min-height: 44px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>vinylclean</h1>
  <a class="vulink" href="/simple.html" data-i18n="vu.link"></a>
  <div class="lang" id="lang"><button data-v="en">EN</button><button data-v="fr">FR</button></div>
  <div class="info" id="info"></div>
</header>

<div class="alert sat" id="sat" data-i18n="alert.sat"></div>
<div class="alert sat" id="satPhono" data-i18n="alert.satPhono"></div>
<div class="alert err" id="err"></div>

<div class="col">
  <section class="card">
    <h2 data-i18n="listen.title"></h2>
    <div class="seg" id="mode">
      <button data-v="0"><span data-i18n="listen.orig"></span><small data-i18n="listen.orig.s"></small></button>
      <button data-v="1"><span data-i18n="listen.removed"></span><small data-i18n="listen.removed.s"></small></button>
      <button data-v="2"><span data-i18n="listen.clean"></span><small data-i18n="listen.clean.s"></small></button>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="sens.title"></h2>
    <div class="row" style="margin-top:0">
      <label><span class="lbl" data-i18n="sens.both"></span> <span id="tSens"></span></label>
      <div class="seg sens" id="sens" style="margin-top:6px">
        <button data-v="0">0</button><button data-v="1">1</button><button data-v="2">2</button>
        <button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
      </div>
    </div>
    <div class="row">
      <label data-i18n="sens.protect"></label>
      <div class="seg" id="protect" style="margin-top:6px">
        <button data-v="0" data-i18n="prot.none"></button><button data-v="1" data-i18n="prot.normal"></button><button data-v="2" data-i18n="prot.max"></button>
      </div>
    </div>
    <p class="note" data-i18n="sens.note"></p>
  </section>

  <section class="card" id="lvCard">
    <details id="lvBox" open>
    <summary><span data-i18n="levels.title"></span><span class="lvsum" id="lvSum"></span></summary>
    <div class="meters" style="margin-top:10px">
      <span data-i18n="levels.inL"></span><div class="bar"><i id="mInL"></i><b class="hold" id="hInL"></b></div><span class="db" id="dInL">–</span>
      <span data-i18n="levels.inR"></span><div class="bar"><i id="mInR"></i><b class="hold" id="hInR"></b></div><span class="db" id="dInR">–</span>
      <span data-i18n="levels.outL"></span><div class="bar"><i id="mOutL"></i><b class="hold" id="hOutL"></b></div><span class="db" id="dOutL">–</span>
      <span data-i18n="levels.outR"></span><div class="bar"><i id="mOutR"></i><b class="hold" id="hOutR"></b></div><span class="db" id="dOutR">–</span>
      <span></span><div class="ticks"><span style="left:0;transform:none">−60</span><span style="left:50%">−30</span><span style="left:80%">−12</span><span style="left:90%">−6</span><span style="left:100%;transform:translateX(-100%)">0</span></div><span class="db" style="font-size:11px">dB</span>
    </div>
    <div class="clipwarn" id="clipLatch" hidden></div>
    <p class="advice" id="lvAdvice"></p>
    <div class="stats" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">
      <div><b id="sBal">–</b><span data-i18n="levels.bal"></span></div>
      <div><b id="sCorr">–</b><span data-i18n="levels.corr"></span></div>
      <div><b id="sNoise">–</b><span data-i18n="levels.noise"></span></div>
      <div><b id="sPlr">–</b><span data-i18n="levels.plr"></span></div>
    </div>
    <p class="note" data-i18n="levels.note"></p>
    </details>
  </section>

  <section class="card">
    <div class="stats">
      <div><b id="sClicks">0</b><span data-i18n="st.clicks"></span></div>
      <div><b id="sCrackles">0</b><span data-i18n="st.crackles"></span></div>
      <div><b id="sLoad">–</b><span data-i18n="st.load"></span></div>
      <div><b id="sXruns">0</b><span data-i18n="st.xruns"></span></div>
    </div>
  </section>

  <section class="card" id="adCard">
    <h2 data-i18n="ad.title"></h2>
    <div class="seg" id="ad">
      <button data-v="0" data-i18n="off"></button>
      <button data-v="1"><span data-i18n="on"></span><small data-i18n="ad.on.s"></small></button>
    </div>
    <div id="adBox">
      <p class="adst" id="adState">–</p>
      <div class="row">
        <label data-i18n="ad.pos"></label>
        <div class="seg" id="autoPos" style="margin-top:6px">
          <button data-v="1"><span data-i18n="ad.auto"></span><small data-i18n="ad.auto.s"></small></button>
          <button data-v="0" data-i18n="ad.manual"></button>
        </div>
      </div>
      <button class="btn small" id="adSide" style="width:100%;margin-top:8px" data-i18n="ad.side"></button>
      <div class="row" id="posRow">
        <label><span class="lbl" data-i18n="ad.radius"></span> <span id="vPosMm">–</span></label>
        <input type="range" id="posMm" min="55" max="146" step="1">
      </div>
      <div class="row">
        <label><span class="lbl" data-i18n="ad.int"></span> <span id="vAdInt">–</span></label>
        <input type="range" id="adInt" min="0" max="1.5" step="0.05">
      </div>
      <details id="armBox" style="margin-top:12px">
        <summary data-i18n="ad.arm"></summary>
        <div class="row">
          <label data-i18n="ad.armLen"></label>
          <input type="number" id="armLen" min="150" max="400" step="0.1" inputmode="decimal">
          <p data-i18n="ad.armLen.s"></p>
        </div>
        <div class="row">
          <label data-i18n="ad.align"></label>
          <select id="align">
            <option value="2" data-i18n="ad.align.2"></option>
            <option value="0" data-i18n="ad.align.0"></option>
            <option value="1" data-i18n="ad.align.1"></option>
            <option value="3" data-i18n="ad.align.3"></option>
          </select>
          <div class="grid2" id="nullsBox">
            <input type="number" id="null1" min="50" max="140" step="0.01" inputmode="decimal">
            <input type="number" id="null2" min="50" max="146" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="row">
          <label data-i18n="ad.stylus"></label>
          <select id="stylus">
            <option value="0" data-i18n="ad.stylus.0"></option>
            <option value="1" data-i18n="ad.stylus.1"></option>
            <option value="2" data-i18n="ad.stylus.2"></option>
            <option value="3" data-i18n="ad.stylus.3"></option>
            <option value="4" data-i18n="ad.stylus.4"></option>
            <option value="5" data-i18n="ad.stylus.5"></option>
          </select>
          <input type="number" id="stylusUm" min="1" max="25" step="0.1" inputmode="decimal">
        </div>
        <div class="row">
          <label data-i18n="ad.disc"></label>
          <select id="disc">
            <option value="0" data-i18n="ad.disc.0"></option>
            <option value="1" data-i18n="ad.disc.1"></option>
            <option value="2" data-i18n="ad.disc.2"></option>
          </select>
        </div>
        <div class="row">
          <label><span class="lbl" data-i18n="ad.side.len"></span> <span id="vSideMin">–</span></label>
          <input type="range" id="sideMin" min="3" max="30" step="1">
        </div>
        <div class="geo">
          <div><b id="gOver">–</b><span data-i18n="ad.overhang"></span></div>
          <div><b id="gOff">–</b><span data-i18n="ad.offset"></span></div>

// ---- Anti-distortion: arm geometry (same formulas as the program) ----
const NULLS = {0: [66.00, 120.90], 1: [70.29, 116.60], 2: [60.325, 117.42]};

function drawTerr(g) {

  let emax = 0; for (let r = 60; r <= 146.1; r += 1) emax = Math.max(emax, Math.abs(g.err(r)));

  for (const e of [emax, -emax]) h += '<text x="2" y="' + (Y(e) + 4) + '">' + (e > 0 ? "+" : "") + e + '°</text>';
  for (const r of [60, 80, 100, 120]) h += '<text x="' + (X(r) - 8) + '" y="' + (H - 6) + '">' + r + '</text>';
  h += '<text x="' + (X(140) - 14) + '" y="' + (H - 6) + '">140 mm</text>';
  h += '<path d="' + p + '" fill="none" stroke="#e8e6e1" stroke-width="1.6"/>';
  for (const r of [g.r1, g.r2]) h += '<circle cx="' + X(r) + '" cy="' + Y(0) + '" r="3.5" fill="#6cbf84"/>';

}
function updateRates() {
  const ci = cards.find(c => c.dev === $("inDev").value), co = cards.find(c => c.dev === $("outDev").value);
  let rates = [44100, 48000, 88200, 96000];
  if (ci && co) rates = ci.in.filter(r => co.out.includes(r));
  const sel = $("rate"), cur = +(sel.value || S.rate);
  sel.innerHTML = "";
  for (const r of rates) {
    // Estimated load from the measured load (proportional to the sample rate).
    let est = "";
    if (St.running && St.rate) {
      const f = (r / St.rate) * ((r > 60000 ? 1.33 : 1) / (St.rate > 60000 ? 1.33 : 1));
      const e = Math.round(St.load * f);
      est = e > 60 ? t("card.heavy", e) : t("card.est", Math.max(1, e));
    }
    const o = new Option(fr(r / 1000, r % 1000 ? 1 : 0) + " kHz" + est, r);
    if (r === cur || (!sel.value && r === S.rate)) o.selected = true;
    sel.add(o);
  }
  const two = $("inDev").value !== $("outDev").value;
  $("cardNote").textContent = two ? t("card.two") : (ci ? t("card.best", ci.format) : "");
  $("cardNote").className = "note" + (two ? " warn" : "");
}

for (const id of ["mode", "protect", "sens", "sensDeclick", "sensDecrackle", "multiband", "stereo", "riaa", "rumble", "ad", "autoPos", "recClean"]) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const v = +b.dataset.v;
    S[id] = v; render(); send({cmd: "set", [id]: v});
  });
}
for (const id of ["armLen", "null1", "null2", "stylusUm", "align", "stylus", "disc"]) {
  $(id).addEventListener("change", () => { const v = +$(id).value; if (!isFinite(v)) return; S[id] = v; render(); send({cmd: "set", [id]: v}); });
}
$("adSide").addEventListener("click", () => send({cmd: "ad_side"}));
for (const id of ["declick", "decrackle", "maxclick", "phonoGain", "posMm", "adInt", "sideMin", "vuRef"]) {
  const el = $(id);
  el.addEventListener("pointerdown", () => dragging = id);
  el.addEventListener("input", () => { S[id] = +el.value; render(); sendSoon({[id]: +el.value}); });
  el.addEventListener("change", () => { dragging = null; send({cmd: "set", [id]: +el.value}); });
}
$("inDev").addEventListener("change", updateRates);
$("outDev").addEventListener("change", updateRates);
$("cardBox").addEventListener("toggle", () => { if ($("cardBox").open) send({cmd: "cards"}); });
$("apply").addEventListener("click", () => {
  send({cmd: "set", in: $("inDev").value, out: $("outDev").value, rate: +$("rate").value});
  $("info").textContent = t("changingCard");
});
// ---- Page mode (index.html?mode=pages, opened from the simple view of the box screen) ----
// The page keeps its normal layout (scrolling) everywhere else. In page mode the
// settings are cut into groups; a group that does not fit the height of the
// screen is split AUTOMATICALLY into several pages (measured after rendering and
// on every resize), never scrolled. The elements are moved, not copied: all the
// existing handlers keep working.
const PG = {
  on: /[?&]mode=pages\b/.test(location.search),
  groups: [], pages: [], cur: 0, timer: 0, anchor: null
};
if (PG.on) {
  document.body.classList.add("pages", "kiosk");
  // Items of a group: the children of its sections, opened containers flattened.
  // An item whose original container is hidden (e.g. anti-distortion off) is left out.
  const FLAT = new Set(["lvBox", "adBox", "armBox", "advBox", "phonoBox", "cardBox"]);
  const collect = (el, deps, out) => {
    for (const c of Array.from(el.children)) {
      if (c.tagName === "SUMMARY") {
        // The title of a folding box becomes a sub-heading (same translation key).
        if (c.closest("#lvBox, #advBox, #cardBox")) continue;   // already the name of the page
        const h = document.createElement("h3"); h.className = "sub"; h.dataset.i18n = c.dataset.i18n || "";
        out.push({node: h, deps}); continue;
      }
      if (FLAT.has(c.id)) { collect(c, deps.concat(c), out); continue; }
      if (c.id === "recList") { out.push({list: c, deps}); continue; }
      out.push({node: c, deps});
    }
  };
  const sec = sel => document.querySelectorAll(sel);
  const cards = Array.from(sec("section.card"));
  const byId = id => document.getElementById(id).closest("section.card");
  const G = [
    ["pg.1", [cards[0], cards[1]]],
    ["pg.2", [byId("lvCard"), byId("sClicks")]],
    ["pg.3", [byId("adCard")]],
    ["pg.4", [byId("advBox")]],
    ["pg.5", [byId("recCard")]],
    ["pg.6", [byId("recsCard")]],
    ["pg.7", [byId("cardBox")]]
  ];
  for (const [key, secs] of G) {
    const items = [];
    for (const sc of secs) collect(sc, [], items);
    // A heading never ends a column or a page alone: it is kept with what follows it.
    for (let i = items.length - 2; i >= 0; --i) {
      const a = items[i], b = items[i + 1];
      if (!a.node || !b.node || !/^H[23]$/.test(a.node.tagName)) continue;
      const w = document.createElement("div"); w.className = "pgw";
      w.append(a.node, b.node);
      items.splice(i, 2, {node: w, deps: a.deps.concat(b.deps)});
    }
    PG.groups.push({key, items});
  }
  $("cardBox").open = true;
  for (const id of ["sat", "satPhono", "err"]) $("pgAlerts").appendChild($(id));
  PG.view = $("pgView");
  PG.park = document.createElement("div"); PG.park.hidden = true; document.body.appendChild(PG.park);

  PG.visible = it => !it.deps.some(d => d.hidden);
  // Builds all the pages. Each item goes into the current page; if the page then
  // overflows (height, or more columns than the screen has), the item starts a new page.
  PG.build = function () {
    const v = this.view, W = v.clientWidth - 16;
    const cols = Math.max(1, Math.min(3, Math.floor(W / 360)));
    const keep = this.anchor;
    for (const li of v.querySelectorAll(".pg > ul.reclist > li")) $("recList").appendChild(li);   // back to their list, in order
    for (const p of this.pages) p.el.remove();
    this.pages = [];
    const over = el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
    const park = this.park;
    this.groups.forEach((g, gi) => {
      let page = null;
      const newPage = () => {
        const el = document.createElement("div");
        el.className = "pg meas"; el.style.columnCount = cols;
        v.appendChild(el);
        page = {el, g: gi, nodes: []}; this.pages.push(page);
      };
      const fits = () => !over(page.el);
      const add = node => {
        page.el.appendChild(node);
        if (!fits() && page.el.children.length > 1) { newPage(); page.el.appendChild(node); }
        page.nodes.push(node);
      };
      const mkUl = () => { const u = document.createElement("ul"); u.className = "reclist"; page.el.appendChild(u); return u; };
      const addLi = li => {
        let ul = page.el.lastElementChild;
        if (!ul || ul.tagName !== "UL") ul = mkUl();
        ul.appendChild(li);
        if (!fits() && (page.el.children.length > 1 || ul.children.length > 1)) {
          li.remove(); if (!ul.children.length) ul.remove();
          newPage(); mkUl().appendChild(li);
        }
        page.nodes.push(li);
      };
      newPage();
      for (const it of g.items) {
        // Hidden items wait in a hidden holder (they stay in the document: the
        // update functions still find them by their id).
        if (!this.visible(it)) { if (it.node) park.appendChild(it.node); continue; }
        if (it.list) { for (const li of Array.from(it.list.querySelectorAll(":scope > li"))) addLi(li); continue; }
        add(it.node);
      }
    });
    for (const p of this.pages) p.el.classList.remove("meas");
    // Stay on the page that holds the element seen before.
    let to = Math.min(this.cur, this.pages.length - 1);
    if (keep) { const i = this.pages.findIndex(p => p.nodes.includes(keep)); if (i >= 0) to = i; }
    this.show(to, 0);
  };
  PG.show = function (i, dir) {
    if (!this.pages.length) return;
    i = Math.max(0, Math.min(this.pages.length - 1, i));
    this.pages.forEach((p, k) => p.el.classList.toggle("cur", k === i));
    const p = this.pages[i];
    p.el.style.setProperty("--from", dir > 0 ? "40px" : dir < 0 ? "-40px" : "0");
    if (dir) { p.el.style.animation = "none"; void p.el.offsetWidth; p.el.style.animation = ""; }
    this.cur = i; this.anchor = p.nodes[0] || null;
    const same = this.pages.filter(q => q.g === p.g), k = same.indexOf(p);
    $("pgTitle").innerHTML = esc(t(this.groups[p.g].key)) + (same.length > 1 ? "<small>" + (k + 1) + "/" + same.length + "</small>" : "");
    const d = $("pgDots"); d.innerHTML = "";
    this.pages.forEach((q, j) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", t(this.groups[q.g].key));
      if (j === i) b.classList.add("sel");
      if (j > 0 && this.pages[j - 1].g !== q.g) b.classList.add("gs");
      b.addEventListener("click", () => this.show(j, j > this.cur ? 1 : -1));
      d.appendChild(b);
    });
    $("pgPrev").disabled = i === 0; $("pgNext").disabled = i === this.pages.length - 1;
    if (this.groups[p.g].key === "pg.7") send({cmd: "cards"});
  };
  // Rebuild soon (not while a slider is held or a list / text field is in use).
  PG.soon = function () {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const a = document.activeElement;
      if (dragging || (a && /^(SELECT|INPUT)$/.test(a.tagName) && a.type !== "range")) { this.soon(); return; }
      this.build();
    }, 80);
  };
  // Cheap check on every status message: rebuild only if the current page overflows.
  PG.check = function () {
    const p = this.pages[this.cur];
    if (p && (p.el.scrollHeight > p.el.clientHeight + 1 || p.el.scrollWidth > p.el.clientWidth + 1)) this.soon();
  };
  $("pgPrev").addEventListener("click", () => PG.show(PG.cur - 1, -1));
  $("pgNext").addEventListener("click", () => PG.show(PG.cur + 1, 1));
  $("pgSimple").addEventListener("click", () => { location.href = "/simple.html"; });
  // Swipe left / right (not when it starts on a control).
  let sw = null;
  PG.view.addEventListener("pointerdown", e => {
    sw = e.target.closest("input, select, button, a, .seg, svg") ? null : {x: e.clientX, y: e.clientY, t: Date.now()};
  });
  PG.view.addEventListener("pointerup", e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy) && Date.now() - sw.t < 800) PG.show(PG.cur + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    sw = null;
  });
  PG.view.addEventListener("pointercancel", () => { sw = null; });
  document.addEventListener("keydown", e => {
    if (document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") PG.show(PG.cur + 1, 1);
    if (e.key === "ArrowLeft" || e.key === "PageUp") PG.show(PG.cur - 1, -1);
  });
  document.addEventListener("contextmenu", e => e.preventDefault());
  let rz = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => PG.build(), 100); });
  // Hooks on the normal update functions.
  const _render = render, _status = status, _renderRecs = renderRecs, _applyLang = applyLang;
  render = function () { _render(); PG.soon(); };
  status = function () { _status(); PG.check(); $("pgDot").classList.toggle("on", !!(ws && ws.readyState === 1)); };
  renderRecs = function () { for (const li of PG.view.querySelectorAll(".pg > ul.reclist > li")) li.remove(); _renderRecs(); PG.soon(); };
  applyLang = function () { _applyLang(); if (PG.pages.length) PG.show(PG.cur, 0); PG.soon(); };
  PG.build();
}
applyLang();
connect();
</script>
